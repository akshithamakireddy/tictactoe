<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe | Modern Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Animated Glow Elements for Background -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <div class="game-wrapper">
    <!-- Main Glassmorphism Card -->
    <main class="glass-card">
      
      <!-- Header -->
      <header class="game-header">
        <div class="game-badge">2-Player Battle</div>
        <h1 class="game-title">TIC <span class="accent-x">TAC</span> <span class="accent-o">TOE</span></h1>
      </header>

      <!-- Score Cards -->
      <section class="scoreboard" aria-label="Game Scores">
        <div class="score-card card-x" id="card-player-x">
          <div class="player-icon-badge x-badge">X</div>
          <div class="score-details">
            <span class="player-name">Player X</span>
            <span class="score-value" id="score-x">0</span>
            <span class="score-label">Wins</span>
          </div>
        </div>

        <div class="score-card card-draw" id="card-draw">
          <div class="player-icon-badge draw-badge">VS</div>
          <div class="score-details">
            <span class="player-name">Ties</span>
            <span class="score-value" id="score-draw">0</span>
            <span class="score-label">Draws</span>
          </div>
        </div>

        <div class="score-card card-o" id="card-player-o">
          <div class="player-icon-badge o-badge">O</div>
          <div class="score-details">
            <span class="player-name">Player O</span>
            <span class="score-value" id="score-o">0</span>
            <span class="score-label">Wins</span>
          </div>
        </div>
      </section>

      <!-- Turn & Game Status Indicator -->
      <div class="status-wrapper">
        <div class="status-pill turn-x" id="status-badge" role="status" aria-live="polite">
          <span class="pulse-indicator" aria-hidden="true"></span>
          <span class="status-message" id="status-text">Player X Turn</span>
        </div>
      </div>

      <!-- 3x3 Game Board -->
      <div class="board-container">
        <div class="grid-board" id="game-board" role="grid" aria-label="Tic Tac Toe 3 by 3 Board">
          <button class="board-cell" role="gridcell" aria-label="Square 1" data-cell-index="0" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 2" data-cell-index="1" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 3" data-cell-index="2" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 4" data-cell-index="3" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 5" data-cell-index="4" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 6" data-cell-index="5" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 7" data-cell-index="6" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 8" data-cell-index="7" type="button"></button>
          <button class="board-cell" role="gridcell" aria-label="Square 9" data-cell-index="8" type="button"></button>
        </div>
      </div>

      <!-- Action Buttons -->
      <footer class="controls-container">
        <button class="btn btn-primary" id="restart-btn" type="button">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>New Game</span>
        </button>

        <button class="btn btn-secondary" id="reset-score-btn" type="button">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <polyline points="23 20 23 14 17 14"></polyline>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
          </svg>
          <span>Reset Score</span>
        </button>
      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
